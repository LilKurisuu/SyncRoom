services:
  syncroom:
    image: syncroom:local
    build: .
    environment:
      SYNCROOM_SECURE_COOKIE: "${SYNCROOM_SECURE_COOKIE:-0}"
    ports:
      - "8765:8765"
    restart: unless-stopped
    volumes:
      - syncroom-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  syncroom-data:
